<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capas de Destaques</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* O Instagram mostra só um círculo no centro: ícone grande e centralizado. */
  .canvas{display:grid;place-items:center}
  .canvas::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:var(--blue-500);filter:blur(140px);opacity:.35}
  .ring{position:relative;width:640px;height:640px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#16388f 0%,var(--navy-800) 60%,var(--navy-900) 100%);
    box-shadow:0 0 0 14px #fff, 0 0 0 26px rgba(79,176,255,.35)}
  .ring svg,.ring img{width:330px;height:330px}
</style>
</head>
<body>
<!-- 1 Quem somos (loja) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/><path d="M10 21v-5h4v5"/></svg></div></div>
<!-- 2 Vagas (maleta) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/><path d="M11 13h2v2h-2z"/></svg></div></div>
<!-- 3 Promotores (megafone) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 15-6v14L3 13z"/><path d="M18 9a3 3 0 0 1 0 6"/><path d="M7 13.5V18a2 2 0 0 0 4 0v-3"/></svg></div></div>
<!-- 4 Degustações (taça) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M12 15v7"/><path d="M6 3h12l-.6 5.5a5.4 5.4 0 0 1-10.8 0z"/><path d="M6.4 8h11.2"/></svg></div></div>
<!-- 5 Eventos (estrelas) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l1.9 5.1L17 10l-5.1 1.9L10 17l-1.9-5.1L3 10l5.1-1.9z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/><path d="M18 3v3M16.5 4.5h3"/></svg></div></div>
<!-- 6 Clientes (aperto de mão) -->
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg></div></div>
<!-- 7 Contato (WhatsApp) -->
<div class="canvas story"><div class="ring"><img src="icone-whatsapp.svg" alt="" style="width:300px;height:300px"></div></div>
</body>
</html>
