<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Post Vini iPhones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --w: 1080px;
    --h: 1350px;
    --texto: #ffffff;
    --texto-suave: rgba(255,255,255,.82);
    --pill-bg: rgba(28,28,30,.72);
    --pill-borda: rgba(255,255,255,.28);
    --cta-bg: #f4f4f4;
    --cta-texto: #111111;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: var(--w); height: var(--h); background: #111; overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: var(--texto); }

  .post { position: relative; width: var(--w); height: var(--h); overflow: hidden; }

  /* Fundo: a mesma foto desfocada preenche áreas vazias quando a foto é reposicionada */
  .fundo { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(40px) brightness(.55); }
  .foto { position: absolute; left: 50%; transform: translateX(-50%); display: block; }

  /* Escurecimento para leitura do texto (topo forte, base leve) */
  .sombra { position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(180deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.55) 22%, rgba(0,0,0,.18) 40%, rgba(0,0,0,0) 52%),
      linear-gradient(0deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%);
  }

  .topo { position: absolute; top: 34px; left: 0; right: 0; text-align: center; }
  .logo { font-family: "Montserrat", sans-serif; font-weight: 200; line-height: .9; color: #f2f2f2; }
  .logo .l1 { font-size: 66px; letter-spacing: .14em; padding-left: .14em; }
  .logo .l2 { font-size: 27px; letter-spacing: .2em; padding-left: .2em; font-weight: 300; margin-top: 2px; }

  .kicker { margin-top: 46px; font-size: 21px; font-weight: 500; letter-spacing: .38em; padding-left: .38em; color: var(--texto-suave); }
  .titulo { margin-top: 18px; font-weight: 800; line-height: .94; letter-spacing: -.01em; text-transform: uppercase; }
  .titulo .t1 { display: block; font-size: var(--t1, 96px); color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
  .titulo .t2 { display: block; font-size: var(--t2, 96px);
    background: linear-gradient(180deg, #ffffff 0%, #d9d9d9 40%, #9a9a9a 75%, #cfcfcf 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,.35)); }
  .sub { margin-top: 22px; font-size: 27px; font-weight: 500; color: #f4f4f4; text-shadow: 0 2px 12px rgba(0,0,0,.5); }

  .pills { margin-top: 26px; display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 0 60px; }
  .pill { background: var(--pill-bg); border: 1.5px solid var(--pill-borda); border-radius: 999px;
    padding: 11px 24px; font-size: 19px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    backdrop-filter: blur(6px); }

  .cta { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
    background: var(--cta-bg); color: var(--cta-texto); border-radius: 999px;
    padding: 18px 38px 18px 28px; display: flex; align-items: center; gap: 16px; white-space: nowrap;
    font-size: 28px; font-weight: 700; letter-spacing: .02em; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  /* Stories 1080x1920: texto e botão fora das áreas cobertas pela interface do Instagram */
  .story { --h: 1920px; }
  .story .topo { top: 230px; }
  .story .cta { bottom: 250px; }
  .story .sombra { background:
      linear-gradient(180deg, rgba(0,0,0,.8) 0%, rgba(0,0,0,.6) 28%, rgba(0,0,0,.2) 42%, rgba(0,0,0,0) 52%),
      linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 30%); }
  .cta svg { width: 40px; height: 40px; flex: none; }

  /* Layout "v2": fundo preto, degradê suave em cima e embaixo, título no topo e
     detalhes (lista + selos) na base, logo acima do botão */
  .v2 .fundo { background: #000 !important; filter: none; }
  .v2 .sombra { background:
      linear-gradient(180deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 14%, rgba(0,0,0,.3) 28%, rgba(0,0,0,0) 38%),
      linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.75) 14%, rgba(0,0,0,.3) 26%, rgba(0,0,0,0) 36%); }
  .base { position: absolute; left: 0; right: 0; bottom: 124px; text-align: center; display: none; }
  .v2 .base { display: block; }
  .v2 .topo .pills { display: none; }
  .lista { font-size: 23px; font-weight: 600; letter-spacing: .06em; color: rgba(255,255,255,.92);
    text-shadow: 0 2px 10px rgba(0,0,0,.6); padding: 0 60px; }
  .lista .ponto { color: rgba(255,255,255,.45); margin: 0 12px; }
  .base .pills { margin-top: 18px; }

  .v2.story .sombra { background:
      linear-gradient(180deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 18%, rgba(0,0,0,.3) 30%, rgba(0,0,0,0) 40%),
      linear-gradient(0deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.88) 18%, rgba(0,0,0,.55) 28%, rgba(0,0,0,0) 42%); }
  .v2.story .topo { top: 170px; }
  .v2.story .logo .l1 { font-size: 80px; }
  .v2.story .logo .l2 { font-size: 32px; }
  .v2.story .kicker { margin-top: 52px; font-size: 25px; }
  .v2.story .titulo .t1 { font-size: var(--t1, 118px); }
  .v2.story .titulo .t2 { font-size: var(--t2, 118px); }
  .v2.story .sub { font-size: 32px; margin-top: 26px; }
  .v2.story .base { bottom: 352px; }
  .v2.story .lista { font-size: 27px; }
  .v2.story .pill { font-size: 22px; padding: 13px 28px; }
  .v2.story .base .pills { margin-top: 24px; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="fundo" id="fundo"></div>
  <img class="foto" id="foto" alt="">
  <div class="sombra"></div>

  <div class="topo">
    <div class="logo"><div class="l1">VINI</div><div class="l2">IPHONES</div></div>
    <div class="kicker" id="kicker"></div>
    <div class="titulo"><span class="t1" id="t1"></span><span class="t2" id="t2"></span></div>
    <div class="sub" id="sub"></div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="base">
    <div class="lista" id="lista"></div>
    <div class="pills" id="pillsBase"></div>
  </div>

  <div class="cta">
    <svg viewBox="0 0 32 32" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round">
      <path d="M16 3.5C9.1 3.5 3.5 9 3.5 15.8c0 2.4.7 4.6 1.9 6.5L3.6 28.5l6.4-1.7c1.8 1 3.9 1.5 6 1.5 6.9 0 12.5-5.5 12.5-12.4S22.9 3.5 16 3.5z"/>
      <path fill="#111" stroke="none" d="M11.6 9.6c-.3-.6-.6-.6-.9-.6h-.8c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.3 3.6 1.5 3.9c.2.3 2.6 4.1 6.4 5.6 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5l-2.4-1.2c-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7l-1.2-2.4z"/>
    </svg>
    <span id="cta"></span>
  </div>
</div>

<script>
  // Dados injetados pelo render.js em window.POST
  const p = window.POST;
  if (p.formato === 'story') document.documentElement.classList.add('story');
  if (p.estilo) document.documentElement.classList.add(p.estilo);
  const post = document.getElementById('post');
  const fundo = document.getElementById('fundo');
  if (p.fundo) { fundo.style.background = p.fundo; fundo.style.filter = 'none'; }
  else fundo.style.backgroundImage = `url("${p.foto}")`;
  const foto = document.getElementById('foto');
  foto.src = p.foto;
  foto.style.width = `${(p.zoom || 1) * 1080}px`;
  foto.style.top = `${p.topo ?? 0}px`;
  // Foto menor que a arte: funde as bordas de cima/baixo no fundo desfocado
  foto.onload = () => {
    const alturaArte = post.offsetHeight, topo = p.topo ?? 0, base = topo + foto.offsetHeight;
    const e = p.esfumado ?? 220;
    const cima = topo > 0 ? `transparent 0, #000 ${e}px` : '#000 0';
    const baixo = base < alturaArte ? `#000 calc(100% - ${e}px), transparent 100%` : '#000 100%';
    const mascaras = [`linear-gradient(180deg, ${cima}, ${baixo})`];
    // Foto mais estreita que a arte: funde também as laterais
    if (foto.offsetWidth < post.offsetWidth) mascaras.push('linear-gradient(90deg, transparent 0, #000 120px, #000 calc(100% - 120px), transparent 100%)');
    foto.style.webkitMaskImage = mascaras.join(', ');
    foto.style.webkitMaskComposite = 'source-in';
    foto.dataset.pronta = '1';
  };
  document.getElementById('kicker').textContent = p.kicker || 'OFERTA ESPECIAL';
  document.getElementById('t1').textContent = p.titulo1;
  document.getElementById('t2').textContent = p.titulo2 || '';
  if (p.tamanhoTitulo1) post.style.setProperty('--t1', p.tamanhoTitulo1 + 'px');
  if (p.tamanhoTitulo2) post.style.setProperty('--t2', p.tamanhoTitulo2 + 'px');
  document.getElementById('sub').textContent = p.subtitulo || '';
  const selos = (p.selos || []).map(s => `<span class="pill">${s}</span>`).join('');
  document.getElementById(p.estilo === 'v2' ? 'pillsBase' : 'pills').innerHTML = selos;
  document.getElementById('lista').innerHTML = (p.lista || []).join('<span class="ponto">•</span>');
  document.getElementById('cta').textContent = p.cta || 'GARANTA O SEU: (85) 98433-0011';
</script>
</body>
</html>
