<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Story Caucaia Metrópole</title>
<!-- Layout corporativo: fundo claro, título forte, foto em card, CTA único. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1f56;--navy-2:#0d2c7a;--blue:#1450d8;--blue-2:#1e6bff;--muted:#5b6785;--line:#dfe6f3;--bg:#f6f8fc;--wa:#25d366}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Poppins',sans-serif;overflow:hidden}
  .canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--navy)}
  .shape{position:absolute;right:-260px;top:-260px;width:760px;height:760px;border-radius:50%;
    background:linear-gradient(135deg,var(--blue-2),var(--blue));opacity:.08}

  .top{position:absolute;left:72px;right:72px;top:150px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:16px}
  .brand img{width:96px}
  .brand .n{font-weight:800;font-size:40px;letter-spacing:1px;line-height:.9;color:var(--blue)}
  .brand .s{font-weight:600;font-size:13px;letter-spacing:5px;color:var(--navy);margin-top:6px}
  .tag{font-weight:600;font-size:22px;letter-spacing:3px;color:var(--blue);text-transform:uppercase;
    border:2px solid var(--blue);border-radius:999px;padding:10px 22px}

  .head{position:absolute;left:72px;right:72px;top:330px}
  .head .pre{font-weight:500;font-size:40px;color:var(--muted)}
  .head h1{font-weight:800;font-size:132px;line-height:1;letter-spacing:-3px;margin-top:6px}
  .head h2{font-weight:700;font-size:58px;line-height:1.1;letter-spacing:-1px;color:var(--blue);margin-top:30px}
  .loc{display:flex;align-items:center;gap:14px;margin-top:30px;font-weight:600;font-size:34px;color:var(--navy)}
  .loc svg{flex:none}

  .photo{position:absolute;left:72px;right:72px;top:800px;height:620px;border-radius:36px;overflow:hidden;
    background:url(fotos/foto-repositor.jpg) center 14%/cover no-repeat;box-shadow:0 30px 60px rgba(10,31,86,.18)}
  .photo .req{position:absolute;left:28px;bottom:28px;display:flex;align-items:center;gap:12px;background:#fff;color:var(--navy);
    font-weight:600;font-size:26px;padding:14px 24px;border-radius:999px;box-shadow:0 10px 24px rgba(10,31,86,.2)}

  .cta{position:absolute;left:72px;right:72px;top:1462px;display:flex;align-items:center;gap:26px;
    background:var(--navy);border-radius:32px;padding:26px 32px;color:#fff}
  .cta .ic{flex:none;width:96px;height:96px;border-radius:50%;background:var(--wa);display:grid;place-items:center}
  .cta .ic img{width:56px}
  .cta .l1{font-weight:500;font-size:26px;color:#c9d8f5}
  .cta .num{font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-1px}
  .foot{position:absolute;left:72px;right:72px;top:1640px;display:flex;justify-content:center;
    font-weight:500;font-size:26px;color:var(--muted);letter-spacing:1px}
</style>
</head>
<body>
<div class="canvas">
  <div class="shape" aria-hidden="true"></div>

  <div class="top">
    <div class="brand">
      <img src="logo-carrinho.svg" alt="">
      <div><div class="n">DIRECT</div><div class="s">PROMOÇÕES</div></div>
    </div>
    <div class="tag">Vagas abertas</div>
  </div>

  <div class="head">
    <div class="pre">Estamos contratando</div>
    <h1>Repositor</h1>
    <h2>e Auxiliar de Depósito</h2>
    <div class="loc">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1450d8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Caucaia e Metrópole – CE
    </div>
  </div>

  <div class="photo">
    <div class="req">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1450d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Experiência em supermercado
    </div>
  </div>

  <div class="cta">
    <div class="ic"><img src="icone-whatsapp.svg" alt=""></div>
    <div><div class="l1">Cadastre-se pelo WhatsApp</div><div class="num">85 99224-5035</div></div>
  </div>
  <div class="foot">@directpromocoes</div>
</div>
</body>
</html>
