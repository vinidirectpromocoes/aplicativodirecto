<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feed Captação</title>
<link rel="stylesheet" href="brand.css">
<style>
  .photo{right:-170px;top:150px;width:700px;height:1200px;background-image:url(fotos/foto-repositor.jpg)}
  .g1{width:480px;height:480px;left:-200px;top:520px} .g2{width:380px;height:380px;right:-140px;top:60px}
  .stripe{left:-120px;top:236px;width:1400px;transform:rotate(-5deg)}
  .tag{position:absolute;right:52px;top:48px;font-size:48px;line-height:1.02;text-align:right;transform:rotate(-8deg);
    text-shadow:0 6px 20px rgba(0,0,0,.4)}
  .tag b{display:block;font-weight:400;font-size:66px;color:var(--sky-300)}
  .content{position:absolute;left:var(--pad);top:300px;width:960px}
  .headline{margin-top:14px} .headline .l1{display:block;font-size:62px} .headline .l2{display:block;font-size:96px}
  .pill{margin-top:22px;padding:12px 26px 12px 14px} .pill .dot{width:48px;height:48px} .pill .txt strong{font-size:34px}
  .glass{margin-top:30px;width:560px;padding:26px}
  .req{display:flex;gap:12px;margin-top:18px;font-weight:600;font-size:20px;color:var(--text-soft);line-height:1.35}
  .item{margin-top:14px;padding:16px 18px} .item .ic{width:68px;height:68px;border-radius:18px} .item h3{font-size:28px}
  .cta{position:absolute;left:var(--pad);right:var(--pad);bottom:44px}
  .ig{justify-content:flex-start;font-size:26px;margin-top:18px} .ig .ig-ic{width:44px;height:44px}
</style>
</head>
<body>
<div class="canvas feed">
  <div class="glow blue g1"></div><div class="glow sky g2"></div>
  <div class="photo"></div>
  <div class="logo-card"><div class="logo sm"><img src="logo-carrinho.svg" alt=""><div class="name">DIRECT</div><div class="sub">PROMOÇÕES</div></div></div>
  <div class="tag script">Junte-se<br>ao nosso<b>time!</b></div>
  <div class="stripe"></div>

  <div class="content">
    <div class="kicker">Vagas abertas</div>
    <h1 class="headline"><span class="l1">Tem experiência em</span><span class="l2 grad-text">Supermercado?</span></h1>
    <div class="pill">
      <div class="dot"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.3 0 11.9 0 20.8 12 30 12 30s12-9.2 12-18.1C24 5.3 18.6 0 12 0zm0 16.5a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z" fill="#1450d8"/></svg></div>
      <div class="txt">Oportunidades em<strong>AQUIRAZ - CE</strong></div>
    </div>
    <div class="glass">
      <div class="label">Estamos contratando</div>
      <div class="item">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.5L22 7H6"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="18" cy="20.5" r="1.4"/></svg></div>
        <div><h3>Repositor</h3></div>
      </div>
      <div class="item">
        <div class="ic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/><path d="m7.5 5.5 9 5"/></svg></div>
        <div><h3>Aux. de Depósito</h3></div>
      </div>
      <div class="req">
        <svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#4fb0ff"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#061334" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Com experiência em supermercado<br>ou que já faz diárias</span>
      </div>
    </div>
  </div>

  <div class="cta">
    <div class="wa sm">
      <div class="icon"><img src="icone-whatsapp.svg" alt=""></div>
      <div class="sep"></div>
      <div><div class="t1">Cadastro pelo WhatsApp</div><div class="num">85 99224-5035</div></div>
    </div>
    <div class="ig"><div class="ig-ic"><img src="icone-instagram.svg" alt=""></div>@directpromocoes</div>
  </div>
</div>
</body>
</html>
