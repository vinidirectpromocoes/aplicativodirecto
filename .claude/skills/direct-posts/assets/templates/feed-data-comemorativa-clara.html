<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feed Data Comemorativa Clara</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Base: feed-data-comemorativa.html, em versão clara (data afetiva). Acento temático amarelo (--accent). */
  .canvas{--hl:var(--blue-500)}
  .ring{position:absolute;border-radius:50%;border:3px solid rgba(30,107,255,.12)}
  .r1{width:900px;height:900px;left:90px;top:120px} .r2{width:640px;height:640px;left:220px;top:250px}
  .dots{position:absolute;width:180px;height:180px;opacity:.55;
    background-image:radial-gradient(var(--sky-400) 3px,transparent 3.5px);background-size:28px 28px}
  .d1{left:60px;top:70px} .d2{right:60px;top:470px}
  .wave{position:absolute;left:-10%;width:120%;border-radius:50%}
  .w1{height:700px;bottom:-470px;background:linear-gradient(90deg,var(--blue-600),var(--blue-500))}
  .w2{height:700px;bottom:-510px;background:var(--navy-800)}
  .symbol{position:absolute;left:50%;top:200px;transform:translateX(-50%);width:280px;height:280px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(145deg,var(--blue-500),var(--navy-700));
    box-shadow:0 30px 70px rgba(20,80,216,.35),inset 0 0 0 4px rgba(143,208,255,.45)}
  .star{position:absolute;right:-6px;top:6px;width:76px;height:76px;border-radius:50%;background:var(--accent);
    display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.18)}
  .content{position:absolute;left:var(--pad);right:var(--pad);top:540px;text-align:center}
  .date{display:inline-block;font-weight:800;font-size:26px;letter-spacing:6px;color:var(--white);text-transform:uppercase;
    padding:12px 28px;border-radius:999px;background:var(--hl)}
  .pre{font-size:84px;margin-top:22px;color:var(--blue-500)}
  .headline{font-size:138px;color:var(--ink);margin-top:-8px}
  .headline .blue{color:var(--blue-500)}
  .msg{margin:44px auto 0;max-width:860px;font-size:32px;color:var(--muted)}
  .msg strong{color:var(--ink)}
  .sign{position:absolute;left:0;right:0;bottom:44px;display:flex;align-items:center;justify-content:center;gap:40px}
  .sign .logo.sm .name{font-size:46px} .sign .logo.sm img{width:100px}
  .canvas .ig{font-size:26px;color:var(--white)} .ig .ig-ic{width:44px;height:44px}
</style>
</head>
<body>
<div class="canvas feed light">
  <div class="dots d1"></div><div class="dots d2"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="wave w1"></div><div class="wave w2"></div>
  <div class="symbol">
    <!-- Balão (estilo Lucide) -->
    <svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16c-3.9 0-7-3.4-7-7.5S8.1 1 12 1s7 3.4 7 7.5S15.9 16 12 16z"/><path d="m10.6 16 1.4 1.6 1.4-1.6"/><path d="M12 17.6c0 1.6-1.6 1.9-1.6 3.2S12 22.6 12 23"/><path d="M8.6 5.4A4.2 4.2 0 0 1 11 3.6"/></svg>
    <div class="star"><svg width="40" height="40" viewBox="0 0 24 24" fill="#0a1f56"><path d="m12 2 2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg></div>
  </div>
  <div class="content">
    <div class="date">12 de outubro</div>
    <div class="pre script">Feliz</div>
    <h1 class="headline">Dia das <span class="blue">Crianças</span></h1>
    <p class="msg body">Para os pequenos que esperam em casa por quem abastece as prateleiras todos os dias: <strong>vocês são a maior motivação do nosso time!</strong></p>
  </div>
  <div class="sign">
    <div class="logo on-dark sm"><img src="logo-carrinho-branco.svg" alt=""><div class="name">DIRECT</div><div class="sub">PROMOÇÕES</div></div>
    <div class="ig"><div class="ig-ic"><img src="icone-instagram.svg" alt=""></div>@directpromocoes</div>
  </div>
</div>
</body>
</html>
