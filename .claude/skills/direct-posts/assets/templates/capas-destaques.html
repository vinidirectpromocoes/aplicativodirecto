<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capas de Destaques</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* O Instagram mostra só um círculo no centro: ícone grande e centralizado. */
  .canvas{display:grid;place-items:center}
  .canvas::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:var(--blue-500);filter:blur(140px);opacity:.35}
  .ring{position:relative;width:640px;height:640px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#16388f 0%,var(--navy-800) 60%,var(--navy-900) 100%);
    box-shadow:0 0 0 14px #fff, 0 0 0 26px rgba(79,176,255,.35)}
  .ring svg,.ring img{width:330px;height:330px}
</style>
</head>
<body>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M2 13h20"/><path d="M11 13h2v2h-2z"/></svg></div></div>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg></div></div>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2.6 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.5L22 7H6"/><circle cx="10" cy="20.5" r="1.4"/><circle cx="18" cy="20.5" r="1.4"/></svg></div></div>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg></div></div>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6 6 0 0 1 3.5 6"/></svg></div></div>
<div class="canvas story"><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/><path d="M10 21v-5h4v5"/></svg></div></div>
<div class="canvas story"><div class="ring"><img src="icone-whatsapp.svg" alt="" style="width:300px;height:300px"></div></div>
</body>
</html>
