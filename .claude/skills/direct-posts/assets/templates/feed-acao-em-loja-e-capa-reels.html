<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Modelos Ação e Reels</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Foto real em tela cheia + faixa padrão embaixo. Troque a foto pela da ação. */
  .full{position:absolute;inset:0;background-size:cover;background-position:center 20%}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,19,52,.55) 0%,rgba(6,19,52,0) 22%,rgba(6,19,52,0) 50%,rgba(6,19,52,.92) 78%,var(--navy-900) 100%)}
  .badge-logo{position:absolute;left:48px;top:48px;background:#fff;border-radius:28px;padding:18px 26px;box-shadow:0 14px 30px rgba(0,0,0,.3)}
  .badge-logo .logo img{width:96px} .badge-logo .logo .name{font-size:44px} .badge-logo .logo .sub{font-size:12px;letter-spacing:3px}
  .badge-logo .logo .sub::before,.badge-logo .logo .sub::after{width:20px;height:2px}
  .band{position:absolute;left:var(--pad);right:var(--pad);bottom:64px}
  .band .headline{font-size:96px;margin-top:14px}
  .band .x{font-family:'Montserrat';font-weight:300;color:var(--sky-400);margin:0 10px 0 2px}
  .band .meta{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
  .band .meta span{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:24px;padding:10px 20px;border-radius:999px;
    background:rgba(255,255,255,.12);border:2px solid rgba(143,208,255,.35)}

  /* Capa de Reels: o feed mostra o centro 1080x1440 — título dentro dessa área. */
  .reel .shade{background:linear-gradient(180deg,rgba(6,19,52,0) 30%,rgba(6,19,52,.85) 62%,rgba(6,19,52,.95) 100%)}
  .reel .badge-logo{top:270px;left:auto;right:48px}
  .reel .band{bottom:auto;top:1150px;text-align:center}
  .reel .kicker{justify-content:center}
  .reel .headline{font-size:120px}
  .play{position:absolute;right:64px;top:300px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;border:2px solid rgba(255,255,255,.5)}
</style>
</head>
<body>

<!-- MODELO: AÇÃO EM LOJA (feed 1080x1350) -->
<div class="canvas feed">
  <div class="full" style="background-image:url(fotos/foto-repositora.jpg);background-position:center 18%"></div>
  <div class="shade"></div>
  <div class="badge-logo"><div class="logo sm"><img src="logo-carrinho.svg" alt=""><div class="name">DIRECT</div><div class="sub">PROMOÇÕES</div></div></div>
  <div class="band">
    <div class="kicker">Ação em loja</div>
    <h1 class="headline">Direct Promoções<br><span class="x">×</span><span class="grad-text">Rede Uniforça</span></h1>
    <div class="meta">
      <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M12 15v7"/><path d="M6 3h12l-.6 5.5a5.4 5.4 0 0 1-10.8 0z"/></svg>Degustação</span>
      <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8fd0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Fortaleza – CE</span>
    </div>
  </div>
</div>

<!-- MODELO: CAPA DE REELS (1080x1920) -->
<div class="canvas story reel">
  <div class="full" style="background-image:url(fotos/foto-repositor.jpg);background-size:130% auto;background-position:75% 0%"></div>
  <div class="shade"></div>
  <div class="badge-logo"><div class="logo sm"><img src="logo-carrinho.svg" alt=""><div class="name">DIRECT</div><div class="sub">PROMOÇÕES</div></div></div>
  <div class="band">
    <div class="kicker">Bastidores</div>
    <h1 class="headline">Um dia de<br><span class="grad-text">repositor</span></h1>
  </div>
</div>
</body>
</html>
