<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feed Data Comemorativa</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Data comemorativa: homenagem, não venda. Pouco texto, um símbolo forte, marca discreta.
     Troque o símbolo (.symbol) e a cor de destaque (--hl) conforme a data — ver references/tipos-de-post.md */
  .canvas{--hl:var(--sky-400)}
  .ring{position:absolute;border-radius:50%;border:3px solid rgba(143,208,255,.18)}
  .r1{width:900px;height:900px;left:90px;top:120px} .r2{width:640px;height:640px;left:220px;top:250px}
  .g1{width:640px;height:640px;left:220px;top:250px}
  .symbol{position:absolute;left:50%;top:250px;transform:translateX(-50%);width:300px;height:300px;border-radius:50%;
    display:grid;place-items:center;background:linear-gradient(145deg,var(--blue-500),var(--navy-700));
    box-shadow:0 30px 80px rgba(20,80,216,.55),inset 0 0 0 4px rgba(143,208,255,.45)}
  .content{position:absolute;left:var(--pad);right:var(--pad);top:620px;text-align:center}
  .date{display:inline-block;font-weight:800;font-size:26px;letter-spacing:6px;color:var(--hl);text-transform:uppercase;
    padding:10px 26px;border-radius:999px;border:2px solid rgba(143,208,255,.4)}
  .pre{font-size:72px;margin-top:26px;color:var(--sky-300)}
  .headline{font-size:120px;margin-top:-6px}
  .msg{margin:30px auto 0;max-width:800px;font-size:30px}
  .sign{position:absolute;left:0;right:0;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .ig{font-size:24px;color:var(--sky-300)} .ig .ig-ic{width:40px;height:40px}
</style>
</head>
<body>
<div class="canvas feed">
  <div class="glow blue g1"></div>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="symbol">
    <!-- Exemplo: Dia do Trabalhador (ferramenta/mão). Troque pelo ícone da data. -->
    <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>
  </div>
  <div class="content">
    <div class="date">1º de maio</div>
    <div class="pre script">Feliz</div>
    <h1 class="headline">Dia do <span class="grad-text">Trabalhador</span></h1>
    <p class="msg body">A cada prateleira abastecida, um trabalho que faz a diferença. <strong>Obrigado a todos que fazem parte do nosso time!</strong></p>
  </div>
  <div class="sign">
    <div class="logo on-dark sm"><img src="logo-carrinho-branco.svg" alt=""><div class="name">DIRECT</div><div class="sub">PROMOÇÕES</div></div>
    <div class="ig"><div class="ig-ic"><img src="icone-instagram.svg" alt=""></div>@directpromocoes</div>
  </div>
</div>
</body>
</html>
